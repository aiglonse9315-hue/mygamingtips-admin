<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided by `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MyGamingTips — Panneau d'administration">

  <!-- ============================================================ -->
  <!-- SÉCURITÉ : Headers de protection (defense-in-depth)         -->
  <!-- ============================================================ -->
  <!-- GitHub Pages ne supportant pas de fichier _headers custom,  -->
  <!-- on utilise les balises <meta http-equiv> équivalentes.      -->
  <!--                                                              -->
  <!-- CSP : restreint les sources de script/style/connect aux      -->
  <!--   domaines légitimes (self + Supabase). Bloque les XSS       -->
  <!--   externes et l'injection de scripts malveillants.           -->
  <!-- X-Frame-Options : empêche le clickjacking (iframe).          -->
  <!-- Referrer-Policy : ne leak pas l'URL admin dans les referers. -->
  <!-- ============================================================ -->

  <!-- Content-Security-Policy : autorise les CDN Flutter + Supabase. -->
  <!-- Flutter Web charge dynamiquement CanvasKit, Roboto, Noto Sans   -->
  <!-- et autres fonts depuis gstatic.com (CDN Google). On autorise    -->
  <!-- *.gstatic.com pour ne pas casser le moteur de rendu.            -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://www.gstatic.com;
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' data: https:;
                 font-src 'self' data: https://*.gstatic.com;
                 connect-src 'self' https://odqbazwyjdpppbameype.supabase.co https://*.gstatic.com;
                 object-src 'none';
                 base-uri 'self';
                 frame-ancestors 'none';
                 worker-src 'self' blob:;">

  <!-- Empêche le rendu dans une iframe (clickjacking). -->
  <meta http-equiv="X-Frame-Options" content="DENY">

  <!-- Ne leak pas l'URL admin dans les headers Referer. -->
  <meta name="referrer" content="no-referrer">

  <!-- Empêche le sniffing MIME. -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MyGamingTips Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MyGamingTips — Admin</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // ==========================================================================
    // Sécurité : obscurcissement anti-inspection (security by obscurity)
    // ==========================================================================
    // Le panneau admin contient des données sensibles (emails, abonnements,
    // jetons). On complique l'inspection du code source et le débogage pour
    // décourager la curiosité courante.
    // NOTE : Ces protections sont contournables par un utilisateur expert,
    // mais elles s'ajoutent au CSP et aux headers de sécurité (defense-in-depth).
    // ==========================================================================

    // Désactive le menu contextuel (clic droit).
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    });

    // Désactive les raccourcis clavier développeur.
    document.addEventListener('keydown', function(e) {
      // F12 (Developer Tools).
      if (e.keyCode === 123) { e.preventDefault(); return false; }
      // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C (DevTools).
      if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
        e.preventDefault(); return false;
      }
      // Ctrl+U (View Source).
      if (e.ctrlKey && e.keyCode === 85) { e.preventDefault(); return false; }
    });

    // Désactive la sélection de texte (rend le copier-coller difficile).
    document.addEventListener('selectstart', function(e) {
      e.preventDefault();
      return false;
    });

    // Désactive le glisser-déposer d'images (évite l'inspection visuelle).
    document.addEventListener('dragstart', function(e) {
      e.preventDefault();
      return false;
    });

    // Détecte l'ouverture des DevTools (méthode dimension fenêtre).
    // Si les DevTools sont ouverts, on masque le contenu.
    setInterval(function() {
      const threshold = 160;
      const widthDiff = window.outerWidth - window.innerWidth > threshold;
      const heightDiff = window.outerHeight - window.innerHeight > threshold;
      if (widthDiff || heightDiff) {
        document.body.style.display = 'none';
      } else {
        document.body.style.display = '';
      }
    }, 1000);
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
