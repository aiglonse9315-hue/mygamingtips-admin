<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided by `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MyGamingTips — Panneau d'administration">

  <!-- ============================================================ -->
  <!-- SÉCURITÉ : Headers de protection (defense-in-depth)         -->
  <!-- ============================================================ -->
  <!-- GitHub Pages ne supportant pas de fichier _headers custom,  -->
  <!-- on utilise les balises <meta http-equiv> équivalentes.      -->
  <!--                                                              -->
  <!-- CSP : restreint les sources de script/style/connect aux      -->
  <!--   domaines légitimes (self + Supabase). Bloque les XSS       -->
  <!--   externes et l'injection de scripts malveillants.           -->
  <!-- X-Frame-Options : empêche le clickjacking (iframe).          -->
  <!-- Referrer-Policy : ne leak pas l'URL admin dans les referers. -->
  <!-- ============================================================ -->

  <!-- Content-Security-Policy : self + Supabase + Flutter CDN. -->
  <!-- Flutter Web a besoin de :                                   -->
  <!--   - gstatic.com : CanvasKit (moteur de rendu WASM) + fonts  -->
  <!--   - unsafe-eval + wasm-unsafe-eval : moteur Dart            -->
  <!--   - worker blob: : workers Flutter                          -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://www.gstatic.com;
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' data: https:;
                 font-src 'self' data: https://fonts.gstatic.com;
                 connect-src 'self' https://odqbazwyjdpppbameype.supabase.co https://www.gstatic.com;
                 object-src 'none';
                 base-uri 'self';
                 frame-ancestors 'none';
                 worker-src 'self' blob:;">

  <!-- Empêche le rendu dans une iframe (clickjacking). -->
  <meta http-equiv="X-Frame-Options" content="DENY">

  <!-- Ne leak pas l'URL admin dans les headers Referer. -->
  <meta name="referrer" content="no-referrer">

  <!-- Empêche le sniffing MIME. -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MyGamingTips Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MyGamingTips — Admin</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
